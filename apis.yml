aid: handy
name: handy
description: >-
  Handy is a home-services marketplace, now part of Angi (ANGI Homeservices), that
  connects customers with pre-screened independent professionals for house cleaning,
  handyman work, furniture assembly, and in-home installations. Handy's Partner API
  lets retailers offer fixed-price installation and service bookings at eCommerce or
  in-store checkout: partners create and manage orders, products, and line items,
  retrieve bookings and their assigned providers, and receive booking-lifecycle
  webhooks. Requests are authenticated with a custom RSA-SHA256 signed-request scheme.
